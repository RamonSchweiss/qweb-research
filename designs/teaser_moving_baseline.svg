<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" font-family="DejaVu Serif" role="img" aria-label="Teaser image: What Moves the Baseline. A comparison has two sides and both of them move. The classical side contributes at most three per cent, the quantum side twenty per cent as predicted, and the observed move is not resolved."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1b33"/><stop offset="1" stop-color="#16294a"/></linearGradient></defs><rect width="1200" height="628" fill="url(#bg)"/><g opacity="0.95"><line x1="1000" y1="150" x2="1144" y2="150" stroke="#f0a06a" stroke-width="11" opacity="0.42" stroke-linecap="butt"/><line x1="1000" y1="141" x2="1000" y2="159" stroke="#f0a06a" stroke-width="1.6" opacity="0.75"/><line x1="1144" y1="141" x2="1144" y2="159" stroke="#f0a06a" stroke-width="1.6" opacity="0.75"/><line x1="856" y1="150" x2="1000" y2="150" stroke="#3f5a80" stroke-width="1.4"/><line x1="915" y1="76" x2="915" y2="190" stroke="#7fb0e6" stroke-width="1.5" stroke-dasharray="6,7" opacity="0.45"/><line x1="1085" y1="76" x2="1085" y2="190" stroke="#7fb0e6" stroke-width="1.5" stroke-dasharray="6,7" opacity="0.45"/><circle cx="903" cy="150" r="5.5" fill="#cfe0f5" opacity="0.9"/><circle cx="909" cy="150" r="5.5" fill="#cfe0f5" opacity="0.9"/><circle cx="915" cy="150" r="5.5" fill="#cfe0f5" opacity="0.9"/><circle cx="920" cy="150" r="5.5" fill="#cfe0f5" opacity="0.9"/><circle cx="927" cy="150" r="5.5" fill="#cfe0f5" opacity="0.9"/><circle cx="1085" cy="150" r="9.5" fill="#f0a06a"/><line x1="930" y1="98" x2="1068" y2="98" stroke="#f0a06a" stroke-width="2.1" opacity="0.9"/><path d="M1085 98 L1068 91 L1068 105 Z" fill="#f0a06a" opacity="0.9"/></g><rect x="72" y="70" width="5" height="62" fill="#f0a06a"/><text x="100" y="94" font-size="15.5" fill="#f0a06a" letter-spacing="4">QWEB &#169; RESEARCH</text><text x="100" y="124" font-size="15.5" fill="#8fa8c8" letter-spacing="3">METHODOLOGY</text><text x="72" y="252" font-size="58" fill="#ffffff" font-weight="bold">What Moves the Baseline</text><rect x="72" y="296" width="132" height="3" fill="#f0a06a"/><text x="72" y="346" font-size="21" fill="#cfe0f5">A comparison has two sides, and both of them move — and in the</text><text x="72" y="378" font-size="21" fill="#cfe0f5">best-documented cases, the quantum claim is itself what moved</text><text x="72" y="410" font-size="21" fill="#cfe0f5">the classical one. One measured case, on which side it sits.</text><rect x="72" y="446" width="1056" height="92" rx="10" fill="#ffffff" opacity="0.06"/><text x="112" y="482" font-size="15" fill="#8fa8c8" letter-spacing="2">THE CLASSICAL SIDE</text><text x="112" y="518" font-size="30" fill="#ffffff" font-weight="bold">+3 % at most</text><line x1="432" y1="464" x2="432" y2="522" stroke="#3f5a80" stroke-width="1.4"/><text x="472" y="482" font-size="15" fill="#8fa8c8" letter-spacing="2">THE QUANTUM SIDE</text><text x="472" y="518" font-size="30" fill="#f0a06a" font-weight="bold">+20 %, predicted</text><line x1="832" y1="464" x2="832" y2="522" stroke="#3f5a80" stroke-width="1.4"/><text x="872" y="482" font-size="15" fill="#8fa8c8" letter-spacing="2">THE OBSERVED MOVE</text><text x="872" y="518" font-size="30" fill="#ffffff" font-weight="bold">not resolved</text><text x="72" y="598" font-size="16.5" fill="#8fa8c8" font-style="italic">qweb-quantum.com &#183; figures from the measured case reported by Daniel Hug, qubit-lab.ch &#183; each with its calculation</text></svg>
