<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" font-family="DejaVu Serif" role="img" aria-label="Teaser image: What Moves the Baseline. Two modelling decisions move the crossover. Grid truncation moves it by up to a factor of four and not monotonically, the classical side accounts for about two hundred oracle calls of that, and the reported correlation move is not resolved."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1b33"/><stop offset="1" stop-color="#16294a"/></linearGradient></defs><rect width="1200" height="628" fill="url(#bg)"/><g opacity="0.95"><line x1="852" y1="196" x2="974" y2="196" stroke="#3f5a80" stroke-width="1.2"/><polyline points="858.0,177.5 913.0,125.2 940.5,143.7 968.0,122.2" fill="none" stroke="#f0a06a" stroke-width="1.8" stroke-dasharray="5,4" opacity="0.85"/><circle cx="858.0" cy="177.5" r="4.6" fill="#16294a" stroke="#f0a06a" stroke-width="1.8"/><circle cx="913.0" cy="125.2" r="4.6" fill="#16294a" stroke="#f0a06a" stroke-width="1.8"/><circle cx="940.5" cy="143.7" r="4.6" fill="#16294a" stroke="#f0a06a" stroke-width="1.8"/><circle cx="968.0" cy="122.2" r="4.6" fill="#16294a" stroke="#f0a06a" stroke-width="1.8"/><text x="913" y="216" font-size="12.5" fill="#8fa8c8" text-anchor="middle">truncation</text><line x1="1006" y1="112" x2="1006" y2="200" stroke="#3f5a80" stroke-width="1" opacity="0.7"/><line x1="1049.6" y1="122" x2="1049.6" y2="186" stroke="#cfe0f5" stroke-width="1.2" stroke-dasharray="3,4" opacity="0.6"/><line x1="1037.8" y1="156" x2="1124.1" y2="156" stroke="#f0a06a" stroke-width="9" opacity="0.42"/><line x1="1037.8" y1="148" x2="1037.8" y2="164" stroke="#f0a06a" stroke-width="1.5" opacity="0.8"/><line x1="1124.1" y1="148" x2="1124.1" y2="164" stroke="#f0a06a" stroke-width="1.5" opacity="0.8"/><circle cx="1081.0" cy="156" r="6" fill="#f0a06a"/><text x="1079" y="196" font-size="12.5" fill="#8fa8c8" text-anchor="middle">correlation</text></g><rect x="72" y="70" width="5" height="62" fill="#f0a06a"/><text x="100" y="94" font-size="15.5" fill="#f0a06a" letter-spacing="4">QWEB &#169; RESEARCH</text><text x="100" y="124" font-size="15.5" fill="#8fa8c8" letter-spacing="3">METHODOLOGY</text><text x="72" y="252" font-size="58" fill="#ffffff" font-weight="bold">What Moves the Baseline</text><rect x="72" y="296" width="132" height="3" fill="#f0a06a"/><text x="72" y="346" font-size="21" fill="#cfe0f5">A comparison has two sides, and both of them move — and in the</text><text x="72" y="378" font-size="21" fill="#cfe0f5">best-documented cases, the quantum claim is itself what moved</text><text x="72" y="410" font-size="21" fill="#cfe0f5">the classical one. Plus one measured case, corrected in public.</text><rect x="72" y="446" width="1056" height="92" rx="10" fill="#ffffff" opacity="0.06"/><text x="112" y="482" font-size="15" fill="#8fa8c8" letter-spacing="2">UNDER GRID TRUNCATION</text><text x="112" y="518" font-size="26" fill="#f0a06a" font-weight="bold">up to ×4, non-monotonic</text><line x1="520" y1="464" x2="520" y2="522" stroke="#3f5a80" stroke-width="1.4"/><text x="560" y="482" font-size="15" fill="#8fa8c8" letter-spacing="2">THE CLASSICAL SHARE</text><text x="560" y="518" font-size="26" fill="#ffffff" font-weight="bold">about ±200 calls</text><line x1="832" y1="464" x2="832" y2="522" stroke="#3f5a80" stroke-width="1.4"/><text x="872" y="482" font-size="15" fill="#8fa8c8" letter-spacing="2">THE REPORTED MOVE</text><text x="872" y="518" font-size="26" fill="#ffffff" font-weight="bold">not resolved</text><text x="72" y="598" font-size="16.5" fill="#8fa8c8" font-style="italic">qweb-quantum.com &#183; estimate and reported values by Daniel Hug, qubit-lab.ch &#183; the classical share is ours</text></svg>
