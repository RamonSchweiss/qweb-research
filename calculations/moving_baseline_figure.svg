<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="Georgia, serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>.ax{stroke:#333;stroke-width:1.2}.tick{stroke:#999;stroke-width:1}.lbl{fill:#333}.dim{fill:#777;font-size:12.5}.ttl{font-size:19px;fill:#111}.sub{font-size:13px;fill:#666}.band{fill:#2b6cb0;opacity:.14}.ivl{stroke:#b7791f;stroke-width:7;opacity:.30;stroke-linecap:butt}</style>
<rect width="980" height="520" fill="#fff"/>
<text x="90" y="46" class="ttl">Which side of the crossover moves?</text>
<text x="90" y="68" class="sub">Shift in the quantum/classical crossover, in per cent. Basket option, 8-qubit grid.</text>
<line x1="90" y1="400" x2="900" y2="400" class="ax"/>
<line x1="90.0" y1="400" x2="90.0" y2="406" class="tick"/>
<text x="90.0" y="424" class="dim" text-anchor="middle">−20%</text>
<line x1="193.8" y1="400" x2="193.8" y2="406" class="tick"/>
<text x="193.8" y="424" class="dim" text-anchor="middle">−10%</text>
<line x1="297.7" y1="400" x2="297.7" y2="406" class="tick"/>
<text x="297.7" y="424" class="dim" text-anchor="middle">+0%</text>
<line x1="401.5" y1="400" x2="401.5" y2="406" class="tick"/>
<text x="401.5" y="424" class="dim" text-anchor="middle">+10%</text>
<line x1="505.4" y1="400" x2="505.4" y2="406" class="tick"/>
<text x="505.4" y="424" class="dim" text-anchor="middle">+20%</text>
<line x1="609.2" y1="400" x2="609.2" y2="406" class="tick"/>
<text x="609.2" y="424" class="dim" text-anchor="middle">+30%</text>
<line x1="713.1" y1="400" x2="713.1" y2="406" class="tick"/>
<text x="713.1" y="424" class="dim" text-anchor="middle">+40%</text>
<line x1="816.9" y1="400" x2="816.9" y2="406" class="tick"/>
<text x="816.9" y="424" class="dim" text-anchor="middle">+50%</text>
<line x1="297.7" y1="120" x2="297.7" y2="406" stroke="#333" stroke-width="1" stroke-dasharray="2,3"/>
<circle cx="733.8" cy="150" r="5" fill="none" stroke="#9b2c2c" stroke-width="1.4"/>
<text x="733.8" y="134" class="dim" text-anchor="middle" fill="#9b2c2c">ours until 1 Nov, at 1/a: +42%</text>
<circle cx="505.4" cy="212" r="5.5" fill="#276749"/>
<text x="505.4" y="196" class="lbl" text-anchor="middle">predicted from the amplitude, at 1/√a: +20%</text>
<line x1="173.1" y1="272" x2="837.7" y2="272" class="ivl"/>
<line x1="173.1" y1="264" x2="173.1" y2="280" stroke="#b7791f" stroke-width="1.4" opacity=".65"/>
<line x1="837.7" y1="264" x2="837.7" y2="280" stroke="#b7791f" stroke-width="1.4" opacity=".65"/>
<circle cx="495.0" cy="272" r="6" fill="#b7791f"/>
<text x="495.0" y="256" class="lbl" text-anchor="middle">observed +19%, reported</text>
<text x="837.7" y="298" class="dim" text-anchor="end">90% interval at 200 repetitions, −12% to +52% — it contains zero</text>
<rect x="287.6" y="310" width="50.3" height="40" class="band"/>
<circle cx="330.9" cy="330" r="4.2" fill="#2b6cb0"/>
<circle cx="316.4" cy="330" r="4.2" fill="#2b6cb0"/>
<circle cx="308.1" cy="330" r="4.2" fill="#2b6cb0"/>
<circle cx="301.8" cy="330" r="4.2" fill="#2b6cb0"/>
<circle cx="296.7" cy="330" r="4.2" fill="#2b6cb0"/>
<circle cx="294.6" cy="330" r="4.2" fill="#2b6cb0"/>
<circle cx="294.6" cy="330" r="4.2" fill="#2b6cb0"/>
<text x="348.9" y="325" class="lbl">the whole classical truncation family, ±3σ to ±5σ</text>
<text x="348.9" y="344" class="dim">+3.2% down to −0.3%, sign flipping near ±3.9σ — our measurement</text>
<circle cx="407.8" cy="372" r="5" fill="none" stroke="#2b6cb0" stroke-width="1.6" stroke-dasharray="3,2"/>
<text x="421.8" y="376" class="dim">equiprobable bins — outside the disclosed family, bounds nothing</text>
<text x="90" y="458" class="lbl">The classical side accounts for at most a sixth of the observed move. The cause sits on the quantum side: a 13.35% smaller</text>
<text x="90" y="479" class="lbl">amplitude, at 1/√a, predicts the move almost exactly. And the move itself is not resolved at 200 repetitions —</text>
<text x="90" y="500" class="lbl">its interval contains zero. About 600 repetitions would put the lower bound above it.</text>
</svg>
