<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Georgia, serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>.ax{stroke:#333;stroke-width:1.2}.tick{stroke:#999;stroke-width:1}.lbl{fill:#333}.dim{fill:#777;font-size:12.5}.ph{font-size:15.5px;fill:#111;font-weight:bold}.ttl{font-size:19px;fill:#111}.sub{font-size:13px;fill:#666}.ivl{stroke:#b7791f;stroke-width:7;opacity:.30;stroke-linecap:butt}</style>
<rect width="980" height="560" fill="#fff"/>
<text x="92" y="46" class="ttl">Which side of the crossover moves, and under which decision?</text>
<text x="92" y="68" class="sub">Basket option, two correlated shares, 8-qubit grid. The crossover is a budget of oracle calls, not a problem size.</text>
<text x="92" y="118" class="ph">Grid truncation</text>
<text x="92" y="138" class="dim">crossover, oracle calls &#183; estimate, not a run</text>
<line x1="92" y1="420" x2="452" y2="420" class="ax"/>
<line x1="92" y1="150" x2="92" y2="420" class="ax"/>
<line x1="87" y1="420.0" x2="92" y2="420.0" class="tick"/>
<text x="82" y="424.0" class="dim" text-anchor="end">0</text>
<line x1="87" y1="357.7" x2="92" y2="357.7" class="tick"/>
<text x="82" y="361.7" class="dim" text-anchor="end">6k</text>
<line x1="87" y1="295.4" x2="92" y2="295.4" class="tick"/>
<text x="82" y="299.4" class="dim" text-anchor="end">12k</text>
<line x1="87" y1="233.1" x2="92" y2="233.1" class="tick"/>
<text x="82" y="237.1" class="dim" text-anchor="end">18k</text>
<line x1="87" y1="170.8" x2="92" y2="170.8" class="tick"/>
<text x="82" y="174.8" class="dim" text-anchor="end">24k</text>
<line x1="122.0" y1="420" x2="122.0" y2="425" class="tick"/>
<text x="122.0" y="442.0" class="dim" text-anchor="middle">±3σ</text>
<line x1="272.0" y1="420" x2="272.0" y2="425" class="tick"/>
<text x="272.0" y="442.0" class="dim" text-anchor="middle">±4σ</text>
<line x1="347.0" y1="420" x2="347.0" y2="425" class="tick"/>
<text x="347.0" y="442.0" class="dim" text-anchor="middle">±4.5σ</text>
<line x1="422.0" y1="420" x2="422.0" y2="425" class="tick"/>
<text x="422.0" y="442.0" class="dim" text-anchor="middle">±5σ</text>
<polyline points="122.0,357.7 272.0,181.2 347.0,243.5 422.0,170.8" fill="none" stroke="#b7791f" stroke-width="1.8" stroke-dasharray="7,5" opacity="0.8"/>
<circle cx="122.0" cy="357.7" r="6" fill="#fff" stroke="#b7791f" stroke-width="2"/>
<circle cx="272.0" cy="181.2" r="6" fill="#fff" stroke="#b7791f" stroke-width="2"/>
<circle cx="347.0" cy="243.5" r="6" fill="#fff" stroke="#b7791f" stroke-width="2"/>
<circle cx="422.0" cy="170.8" r="6" fill="#fff" stroke="#b7791f" stroke-width="2"/>
<text x="347.0" y="269.5" class="dim" text-anchor="middle" fill="#b7791f">below ±4σ</text>
<rect x="93.0" y="355.7" width="358.0" height="2.5" fill="#2b6cb0" opacity="0.5"/>
<text x="452" y="331.7" class="lbl" text-anchor="end">the classical side, whole family</text>
<text x="452" y="348.7" class="dim" text-anchor="end">+3.2% to −0.3% — about ±200 calls</text>
<text x="568" y="118" class="ph">Correlation 0.5 → 0</text>
<text x="568" y="138" class="dim">same grid, ±3.5σ &#183; change in the crossover</text>
<line x1="568" y1="420" x2="928" y2="420" class="ax"/>
<line x1="580.9" y1="420" x2="580.9" y2="425" class="tick"/>
<text x="580.9" y="442" class="dim" text-anchor="middle">−10%</text>
<line x1="645.1" y1="420" x2="645.1" y2="425" class="tick"/>
<text x="645.1" y="442" class="dim" text-anchor="middle">+0%</text>
<line x1="709.4" y1="420" x2="709.4" y2="425" class="tick"/>
<text x="709.4" y="442" class="dim" text-anchor="middle">+10%</text>
<line x1="773.7" y1="420" x2="773.7" y2="425" class="tick"/>
<text x="773.7" y="442" class="dim" text-anchor="middle">+20%</text>
<line x1="838.0" y1="420" x2="838.0" y2="425" class="tick"/>
<text x="838.0" y="442" class="dim" text-anchor="middle">+30%</text>
<line x1="902.3" y1="420" x2="902.3" y2="425" class="tick"/>
<text x="902.3" y="442" class="dim" text-anchor="middle">+40%</text>
