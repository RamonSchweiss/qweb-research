<circle cx="773.7" cy="206" r="5.5" fill="#276749"/>
<text x="773.7" y="190" class="lbl" text-anchor="middle">predicted at 1/√a: +20%</text>
<line x1="606.6" y1="276" x2="889.4" y2="276" class="ivl"/>
<line x1="606.6" y1="268" x2="606.6" y2="284" stroke="#b7791f" stroke-width="1.6" opacity="0.75"/>
<line x1="889.4" y1="268" x2="889.4" y2="284" stroke="#b7791f" stroke-width="1.6" opacity="0.75"/>
<circle cx="748.0" cy="276" r="6" fill="#b7791f"/>
<text x="748.0" y="260" class="lbl" text-anchor="middle">reported +16%</text>
<text x="928" y="304" class="dim" text-anchor="end">90% interval at 400 repetitions, −6% to +38%</text>
<text x="928" y="322" class="dim" text-anchor="end">— it contains zero</text>
<line x1="510" y1="100" x2="510" y2="450" stroke="#ddd" stroke-width="1"/>
<text x="92" y="492" class="lbl">Two modelling decisions, two different effects, and neither of them appears in a result summary. Truncation moves the</text>
<text x="92" y="513" class="lbl">crossover by far more than the classical side can account for, and not monotonically. Correlation moves it by the amount the</text>
<text x="92" y="534" class="lbl">amplitude predicts — but at 400 repetitions that move is still not resolved.</text>
</svg>
